<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Investment Calculators: a token-driven workspace for financial tools."
    />
    <title>Investment Calculators</title>
    <script>
      ;(() => {
        const param = new URLSearchParams(window.location.search).get(
          'clawpilotTheme',
        )
        const theme =
          param ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light')
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <style>
      :root {
        color-scheme: light;
        --cp-bg: #f7f4ef;
        --cp-bg-elevated: #fcfbf8;
        --cp-surface: #ffffff;
        --cp-surface-soft: #f5f5f5;
        --cp-border: #dedede;
        --cp-border-strong: #919191;
        --cp-text: #242424;
        --cp-text-muted: #5c5c5c;
        --cp-text-soft: #6f6f6f;
        --cp-accent: #1c8454;
        --cp-accent-hover: #006620;
        --cp-accent-soft: rgba(73, 157, 59, 0.08);
        --cp-accent-fg: #ffffff;
        --cp-success: #16a34a;
        --cp-danger: #dc2626;
        --cp-warning: #f59e0b;
        --cp-link: #0078d4;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
        --cp-overlay: rgba(255, 255, 255, 0.8);
        --cp-panel: rgba(255, 255, 255, 0.86);
        --cp-panel-strong: rgba(255, 255, 255, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.55);
        --cp-highlight: rgba(73, 157, 59, 0.12);
        --cp-shadow-card:
          0 0 2px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.14);
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --cp-bg: #383b3f;
        --cp-bg-elevated: #313239;
        --cp-surface: #26292e;
        --cp-surface-soft: #2c2e35;
        --cp-border: #42474f;
        --cp-border-strong: #5d5f6b;
        --cp-text: #dedede;
        --cp-text-muted: #8c9193;
        --cp-text-soft: #a9b0b2;
        --cp-accent: #34ab6f;
        --cp-accent-hover: #007140;
        --cp-accent-soft: rgba(52, 171, 111, 0.14);
        --cp-accent-fg: #151a1c;
        --cp-success: #37bd69;
        --cp-danger: #d46367;
        --cp-warning: #d8bf24;
        --cp-link: #6895ff;
        --cp-shadow: 0 18px 48px rgba(0, 2, 3, 0.32);
        --cp-overlay: rgba(60, 65, 73, 0.88);
        --cp-panel: rgba(60, 65, 73, 0.72);
        --cp-panel-strong: rgba(60, 65, 73, 0.96);
        --cp-sheen: rgba(247, 255, 250, 0.04);
        --cp-highlight: rgba(148, 192, 141, 0.12);
      }
      body {
        margin: 0;
        background: var(--cp-bg);
        color: var(--cp-text);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
